[project]
name = "rag-against-the-machine"
version = "1.0.0"
description = "Retrieval Augmented Generation"
requires-python = ">=3.10, <3.11"
dependencies = [
    "pydantic>=2.0.0",
    "fire>=0.6.0",
    "tqdm>=4.66.0",
    "bm25s>=0.2.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "accelerate>=0.27.0",
    "fastapi[standard]>=0.111.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
]

[tool.uv]
package = false

[tool.mypy]
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = [
    "faiss",
    "bm25s",
    "fire",
    "fire.*",
    "tqdm",
    "sklearn.*",
]
ignore_missing_imports = true
