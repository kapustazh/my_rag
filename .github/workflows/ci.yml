name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-strict:
    name: lint-strict
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python 3.10 --group dev

      - name: Run make lint-strict
        run: make lint-strict

  open-pull-request:
    name: open-pull-request
    if: github.event_name == 'push'
    needs: lint-strict
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_pr="$(gh pr list --head "${GITHUB_REF_NAME}" --base main --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$existing_pr" ] && [ "$existing_pr" != "null" ]; then
            echo "Pull request #${existing_pr} already exists for ${GITHUB_REF_NAME}."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --body "Auto-created pull request for branch \`${GITHUB_REF_NAME}\`."
